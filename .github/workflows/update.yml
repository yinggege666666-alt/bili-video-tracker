name: 每小时更新B站数据

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: bili-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 更新数据并处理增删请求
        run: python cloud_fetch.py --process-issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: 提交数据更新
        run: |
          git config user.name "bili-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json config.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: 每小时数据更新 [skip ci]"
            git push
          fi
